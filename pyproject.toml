[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-guard"
version = "0.1.0"
description = "Prompt-injection screening layer: normaliser, rules, fine-tuned classifier, decision layer, FastAPI service and OpenAI-compatible proxy."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aditya Jain" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "pyyaml>=6",
  "scikit-learn>=1.4",
  "torch>=2.2",
  "transformers>=4.45",
  "huggingface_hub>=0.25",
  "sentencepiece>=0.2",
  "protobuf>=5.29",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "playwright>=1.45"]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentinel = ["rules_data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: trains or loads a transformer model (deselect with -m 'not slow')"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
